<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="style4.css">
</head>

<body>

    <div class="container">

        <h2>Registration Form</h2>

        <form>

            <div class="form-group">
                <label>Name:</label>
                <input type="text" name="uname" id="uname"
                placeholder="Enter the name" required>
            </div>

            <div class="form-group">
                <label>USN:</label>
                <input type="text" name="usn" id="usn"
                placeholder="Enter the usn" required>
            </div>

            <div class="form-group">
                <label>Phno:</label>
                <input type="tel" name="phno" id="phno"
                placeholder="Enter the phno" required>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" id="email"
                placeholder="Enter the email" required>
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" id="password"
                placeholder="Enter the password" required>
            </div>

            <div class="form-group">
                <label>DOB:</label>
                <input type="date" name="dob" id="dob" required>
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <div class="gender-options">
                    <label>
                        <input type="radio" name="gender"> Male
                    </label>

                    <label>
                        <input type="radio" name="gender"> Female
                    </label>

                    <label>
                        <input type="radio" name="gender"> Other
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Hobbies:</label>
                <div class="gender-options">
                    <label>
                        <input type="checkbox" name="hobbies"> Eat
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies"> Sleep
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies"> Read
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Pick the color:</label>
                <input type="color" name="color">
            </div>

            <div class="form-group">
                <label>Upload the photo:</label>
                <input type="file" name="photo">
            </div>

            <div class="button-group">
                <input type="submit" value="Click to Submit">
                <input type="reset" value="Reset">
            </div>

        </form>

    </div>

</body>
</html>
